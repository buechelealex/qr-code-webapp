<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text &amp; Link – QR-Code-Generator</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Übersicht</a>
    <h1>Text &amp; Link</h1>

    <form>
      <label>Inhalt
        <textarea id="content" rows="4" placeholder="https://example.com" autofocus></textarea>
      </label>
      <button type="button" id="paste" class="secondary">Aus der Zwischenablage einfügen</button>

      <details>
        <summary>Darstellung</summary>
        <div class="row">
          <label>Größe
            <select id="size">
              <option value="256">256 px</option>
              <option value="512" selected>512 px</option>
              <option value="1024">1024 px</option>
              <option value="2048">2048 px</option>
            </select>
          </label>
          <label>Fehlerkorrektur
            <select id="ecc">
              <option value="L">Niedrig (7 %)</option>
              <option value="M" selected>Mittel (15 %)</option>
              <option value="Q">Hoch (25 %)</option>
              <option value="H">Sehr hoch (30 %)</option>
            </select>
          </label>
          <label>Vordergrund <input type="color" id="fg" value="#000000"></label>
          <label>Hintergrund <input type="color" id="bg" value="#ffffff"></label>
        </div>
      </details>
    </form>

    <section id="result" hidden>
      <canvas id="qr"></canvas>
      <div class="actions">
        <button id="download-png">PNG herunterladen</button>
        <button id="download-svg">SVG herunterladen</button>
        <button id="copy">Kopieren</button>
      </div>
    </section>
    <p id="status" role="status"></p>
  </main>

  <footer>
    <a href="https://projects.abuechele.de/impressum">Impressum</a>
    <a href="https://github.com/buechelealex/qr-code-webapp">Quellcode auf GitHub</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>

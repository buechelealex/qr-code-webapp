<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WLAN – QR-Code-Generator</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../index.html">← Übersicht</a>
    <h1>WLAN</h1>

    <form>
      <label>Netzwerkname (SSID)
        <input id="ssid" autocomplete="off" autofocus>
      </label>
      <label>Passwort
        <input id="password" autocomplete="off">
      </label>
      <div class="row">
        <label>Verschlüsselung
          <select id="encryption">
            <option value="WPA" selected>WPA/WPA2/WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">Keine</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="hidden"> Verstecktes Netzwerk</label>
      </div>

      <details>
        <summary>Darstellung</summary>
        <div class="row">
          <label>Größe
            <select id="size">
              <option value="256">256 px</option>
              <option value="512" selected>512 px</option>
              <option value="1024">1024 px</option>
              <option value="2048">2048 px</option>
            </select>
          </label>
          <label>Fehlerkorrektur
            <select id="ecc">
              <option value="L">Niedrig (7 %)</option>
              <option value="M" selected>Mittel (15 %)</option>
              <option value="Q">Hoch (25 %)</option>
              <option value="H">Sehr hoch (30 %)</option>
            </select>
          </label>
          <label>Vordergrund <input type="color" id="fg" value="#000000"></label>
          <label>Hintergrund <input type="color" id="bg" value="#ffffff"></label>
        </div>
      </details>
    </form>

    <section id="result" hidden>
      <canvas id="qr"></canvas>
      <div class="actions">
        <button id="download-png">PNG herunterladen</button>
        <button id="download-svg">SVG herunterladen</button>
        <button id="copy">Kopieren</button>
      </div>
    </section>
    <p id="status" role="status"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
